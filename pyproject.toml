[project]
name = "poio-lib"
version = "0.1.3"
description = "A NLP library of common functionality within the Poio project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.8.1",
    "pressagio==0.1.6",
    "regex>=2025.9.18",
    "requests>=2.32.5",
    "syntok==1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.10",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poiolib"]

